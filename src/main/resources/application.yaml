spring:
  application:
    name: spring-is-cool
  main:
    web-application-type: none
    keep-alive: true

spring-is-cool:
  ssh:
    enabled: true
    host: 127.0.0.1
    port: 2222
    demo-user: demo
    demo-password: demo
    host-key-path: build/ssh/hostkey.ser
  ai:
    enabled: false
    provider: static
    project: ${GOOGLE_CLOUD_PROJECT:}
    location: ${GOOGLE_CLOUD_LOCATION:}
    model-id: ${VERTEX_AI_MODEL_ID:}
