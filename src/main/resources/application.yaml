spring:
  application:
    name: spring-is-cool
  main:
    keep-alive: true

spring-is-cool:
  ssh:
    enabled: true
    host: 127.0.0.1
    port: 2222
    demo-user: demo
    demo-password: demo
    host-key-path: build/ssh/hostkey.ser
  ai:
    enabled: false
    provider: static
    project: ${GOOGLE_CLOUD_PROJECT:}
    location: ${GOOGLE_CLOUD_LOCATION:}
    model-id: ${VERTEX_AI_MODEL_ID:}
  persistence:
    enabled: true
    type: sqlite
    sqlite-path: ${SPRING_IS_COOL_PERSISTENCE_SQLITE_PATH:build/data/world.sqlite}
    session-id: ${SPRING_IS_COOL_PERSISTENCE_SESSION_ID:default-office}
